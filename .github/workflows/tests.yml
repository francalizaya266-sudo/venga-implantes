name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, zip, gd, exif
          # pcov mide qué líneas de app/ recorren las pruebas (E4, reporte de cobertura).
          coverage: pcov

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formato (Pint)
        run: vendor/bin/pint --test

      - name: Pruebas con cobertura
        run: >-
          php artisan test --coverage-clover=cobertura/clover.xml --coverage-html=cobertura/html
          --coverage-text=cobertura/resumen.txt --only-summary-for-coverage-text

      # Meta: 90 % de las líneas de app/ (hoy, 96 %). Deja margen para pantallas del panel que se prueban a mano y
      # avisa si un cambio grande llega sin pruebas. La cobertura de cada carpeta queda en el resumen del job.
      - name: Cobertura mínima
        run: |
          python3 - <<'PY'
          import collections, os, sys, xml.etree.ElementTree as ET
          raiz = ET.parse('cobertura/clover.xml').getroot()
          total = raiz.find('project/metrics')
          lineas, cubiertas = int(total.get('statements')), int(total.get('coveredstatements'))
          por_carpeta = collections.defaultdict(lambda: [0, 0])
          for archivo in raiz.iter('file'):
              partes = archivo.get('name').split('/app/', 1)[-1].split('/')
              carpeta = 'app/' + '/'.join(partes[:2] if len(partes) > 2 else partes[:1])
              m = archivo.find('metrics')
              por_carpeta[carpeta][0] += int(m.get('statements'))
              por_carpeta[carpeta][1] += int(m.get('coveredstatements'))
          porcentaje = 100 * cubiertas / lineas
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumen:
              resumen.write(f'### Cobertura del backend: {porcentaje:.2f} % de {lineas} líneas (meta 90 %)\n\n')
              resumen.write('| Carpeta | Líneas | Cubiertas | % |\n| --- | ---: | ---: | ---: |\n')
              for carpeta, (total_c, cub) in sorted(por_carpeta.items(), key=lambda x: -x[1][0]):
                  if total_c:
                      resumen.write(f'| {carpeta} | {total_c} | {cub} | {100 * cub / total_c:.1f} |\n')
          print(f'Cobertura de líneas: {porcentaje:.2f} %')
          sys.exit(0 if porcentaje >= 90 else 1)
          PY

      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/cobertura
          retention-days: 30

  # Larastan (PHPStan para Laravel) revisa los tipos de app/ sin ejecutar nada: encuentra métodos o propiedades que
  # no existen y argumentos del tipo equivocado antes de que lleguen a producción (E4, CE0244).
  analisis:
    name: Análisis estático (Larastan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, zip, gd, exif
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=raw

  # Las vistas, funciones, procedimientos y triggers de database/sql/mysql solo existen en MySQL: aquí se prueban
  # con un MySQL 8 de verdad, junto con toda la suite, los usuarios de seguridad.sql y una copia restaurada con el
  # tiempo medido.
  mysql:
    name: Base de datos (MySQL 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          # Base que nace y muere con este job, sin datos reales: estas claves no protegen nada.
          MYSQL_ROOT_PASSWORD: solo-para-ci
          MYSQL_DATABASE: consultorio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psolo-para-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_PWD_ROOT: solo-para-ci
      CLAVE_APP: ci-app-solo-prueba
      CLAVE_DESPLIEGUE: ci-despliegue-solo-prueba
      CLAVE_REPORTES: ci-reportes-solo-prueba
      CLAVE_RESPALDO: ci-respaldo-solo-prueba

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, zip, gd, exif
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
          mysql --version
          # En Azure se activa en Parámetros del servidor: sin esto, un usuario sin SUPER no crea funciones ni triggers.
          mysql -h 127.0.0.1 -uroot -p"$MYSQL_PWD_ROOT" -e "SET GLOBAL log_bin_trust_function_creators = 1; CREATE DATABASE consultorio_pruebas CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Pruebas de vistas, funciones, procedimientos y triggers
        run: php artisan test --group=mysql
        env:
          DB_DATABASE: consultorio_pruebas
          DB_USERNAME: root
          DB_PASSWORD: solo-para-ci

      # Toda la suite otra vez, ahora sobre el motor de producción: SQLite deja pasar consultas que MySQL rechaza
      # (así apareció el DISTINCT con ORDER BY de TreatmentPlanService::linkCampaign, error 3065).
      - name: Suite completa sobre MySQL 8
        run: php artisan test
        env:
          DB_DATABASE: consultorio_pruebas
          DB_USERNAME: root
          DB_PASSWORD: solo-para-ci

      - name: Crear los usuarios (seguridad.sql, antes de migrar)
        run: |
          ( echo "SET @clave_app='$CLAVE_APP', @clave_despliegue='$CLAVE_DESPLIEGUE', @clave_reportes='$CLAVE_REPORTES', @clave_respaldo='$CLAVE_RESPALDO';"
            cat database/sql/seguridad.sql ) | mysql -h 127.0.0.1 -uroot -p"$MYSQL_PWD_ROOT" consultorio

      - name: Migrar y cargar los datos de demostración con el usuario de despliegue
        run: |
          php artisan migrate --force
          APP_ENV=local php artisan db:seed --force
          php artisan bd:objetos
        env:
          DB_DATABASE: consultorio
          DB_USERNAME: consultorio_despliegue
          DB_PASSWORD: ${{ env.CLAVE_DESPLIEGUE }}

      - name: Dar a reportes las vistas (seguridad.sql otra vez) y comprobar cada usuario
        run: |
          ( echo "SET @clave_app='$CLAVE_APP', @clave_despliegue='$CLAVE_DESPLIEGUE', @clave_reportes='$CLAVE_REPORTES', @clave_respaldo='$CLAVE_RESPALDO';"
            cat database/sql/seguridad.sql ) | mysql -h 127.0.0.1 -uroot -p"$MYSQL_PWD_ROOT" consultorio
          bash database/sql/probar-seguridad.sh

      - name: Copia y restauración cronometradas
        run: |
          root() { mysql -h 127.0.0.1 -uroot -p"$MYSQL_PWD_ROOT" consultorio -N -e "$1"; }
          DB_USERNAME=consultorio_app DB_PASSWORD="$CLAVE_APP" php artisan respaldo:crear
          pagos=$(root "SELECT COUNT(*) FROM payments")
          # Un daño hecho por fuera de la aplicación: el trigger lo anota en la bitácora.
          root "DELETE FROM payments ORDER BY id LIMIT 10; UPDATE patients SET first_name = 'DAÑADO';"
          inicio=$(date +%s%N)
          DB_USERNAME=consultorio_despliegue DB_PASSWORD="$CLAVE_DESPLIEGUE" php artisan respaldo:restaurar --force
          echo "Restauración: $(( ($(date +%s%N) - inicio) / 1000000 )) ms"
          test "$(root "SELECT COUNT(*) FROM payments")" = "$pagos"
          test "$(root "SELECT COUNT(*) FROM patients WHERE first_name = 'DAÑADO'")" = "0"
          test "$(root "SELECT COUNT(*) FROM payment_audit_logs WHERE event = 'deleted'")" = "10"
          test "$(root "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema = 'consultorio'")" = "2"
          bash database/sql/probar-seguridad.sh
        env:
          DB_DATABASE: consultorio

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      # Con cobertura: falla si baja de los mínimos de vite.config.ts (85 % de las líneas, 70 % de las ramas).
      - name: Pruebas con cobertura
        run: npm run test:coverage

      - name: Guardar el reporte de cobertura de la web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web
          path: frontend/coverage
          retention-days: 30

      # Revisa los tipos y compila: lo que no compila no llega al hosting.
      - name: Compilar
        run: npm run build

  # El sistema listo para subir al hosting compartido, que no tiene Node: backend/ con la web ya compilada.
  paquete:
    name: Paquete para el hosting
    if: github.event_name == 'push'
    needs: [backend, mysql, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar la web
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: consultorio-para-hosting
          path: |
            backend
            !backend/tests
          # Laravel necesita sus archivos ocultos (public/.htaccess, .env.example).
          include-hidden-files: true
          if-no-files-found: error
