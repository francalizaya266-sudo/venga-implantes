#cloud-config
# vm-jump y vm-recepcion: herramientas para administrar y para probar la red.
timezone: America/Lima
package_update: true
package_upgrade: true

# 1 GiB de RAM: el swap evita que Composer o un pico de PHP agoten la memoria.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

packages:
  - curl
  - jq
  - nmap
  - w3m
  - mysql-client
  - netcat-openbsd
  - dnsutils
  - traceroute
