#cloud-config
# vm-proxy (DMZ): nginx con ModSecurity y las reglas OWASP CRS (WAF), HTTPS con Let's Encrypt y caché de
# /app/assets. Recibe lo que el firewall le reenvía desde internet y lo pasa a vm-app (10.20.4.4).
# ModSecurity empieza en modo detección: se pasa a bloqueo en la fase de pruebas (infra/README.md).
timezone: America/Lima
# Sale a internet por el firewall (vm-fw), que nace a la vez: espera hasta 15 minutos a que dé salida y DNS.
bootcmd:
  - [sh, -c, 'for i in $(seq 1 90); do curl -s --max-time 5 -o /dev/null http://azure.archive.ubuntu.com/ubuntu/ && exit 0; sleep 10; done; exit 0']
package_update: true
package_upgrade: true

# 1 GiB de RAM: el swap evita que Composer o un pico de PHP agoten la memoria.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

packages:
  - nginx
  - libnginx-mod-http-modsecurity
  - modsecurity-crs
  - certbot
  - python3-certbot-nginx
  - curl
  - jq

write_files:
  - path: /etc/nginx/modsec/main.conf
    content: |
      # Configuración base de ModSecurity (la trae libnginx-mod-http-modsecurity en Ubuntu 24.04) y reglas OWASP CRS.
      Include /etc/nginx/modsecurity.conf
      Include /etc/modsecurity/crs/crs-setup.conf
      Include /usr/share/modsecurity-crs/rules/*.conf

runcmd:
  # Detección primero: registra en /var/log/modsec_audit.log sin bloquear. En la fase de pruebas se cambia a "On".
  - sed -i 's/^SecRuleEngine .*/SecRuleEngine DetectionOnly/' /etc/nginx/modsecurity.conf
  - sed -i 's#^SecAuditLog .*#SecAuditLog /var/log/modsec_audit.log#' /etc/nginx/modsecurity.conf
  - mkdir -p /var/cache/nginx/vega /etc/vega
  - chown www-data:www-data /var/cache/nginx/vega
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl enable --now nginx
