#cloud-config
# vm-respaldo: recibe por la VPN una copia de la base de datos cada hora y MySQL para probar restauraciones.
timezone: America/Lima
# Sale a internet por el firewall (vm-fw), que nace a la vez: espera hasta 15 minutos a que dé salida y DNS.
bootcmd:
  - [sh, -c, 'for i in $(seq 1 90); do curl -s --max-time 5 -o /dev/null http://azure.archive.ubuntu.com/ubuntu/ && exit 0; sleep 10; done; exit 0']
package_update: true
package_upgrade: true

# 1 GiB de RAM: el swap evita que Composer o un pico de PHP agoten la memoria.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

packages:
  - mysql-server
  - curl
  - jq

users:
  - default
  # Usuario que solo recibe copias. Su llave pública se agrega después (ver infra/README.md, fase 7).
  - name: respaldo
    shell: /bin/bash
    lock_passwd: true

runcmd:
  - mkdir -p /srv/respaldos
  - chown respaldo:respaldo /srv/respaldos
  - chmod 750 /srv/respaldos
  - systemctl enable --now mysql
