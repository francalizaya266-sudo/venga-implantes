#cloud-config
# vm-wazuh: Wazuh todo en uno (indexador, servidor y tablero).
# Con 4 GB de RAM se instala con -i (ignora el mínimo recomendado): sirve para un laboratorio pequeño.
# Revisa la versión vigente en https://documentation.wazuh.com y cámbiala aquí si hace falta.
timezone: America/Lima
# Sale a internet por el firewall (vm-fw), que nace a la vez: espera hasta 15 minutos a que dé salida y DNS.
bootcmd:
  - [sh, -c, 'for i in $(seq 1 90); do curl -s --max-time 5 -o /dev/null http://azure.archive.ubuntu.com/ubuntu/ && exit 0; sleep 10; done; exit 0']
package_update: true
package_upgrade: true

packages:
  - curl
  - jq

users:
  - default
  # Recibe la copia horaria de la base de datos desde vm-app (infra/scripts/copy-to-dr.sh).
  - name: respaldo
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /opt/vega/instalar-wazuh.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      WAZUH_VERSION=4.12
      cd /root
      curl -sO "https://packages.wazuh.com/${WAZUH_VERSION}/wazuh-install.sh"
      bash ./wazuh-install.sh -a -i | tee /root/wazuh-install.log
      # Las contraseñas generadas quedan en /root/wazuh-install-files.tar: pásalas a 1Password.

runcmd:
  - mkdir -p /srv/respaldos
  - chown respaldo:respaldo /srv/respaldos
  - chmod 750 /srv/respaldos
  - /opt/vega/instalar-wazuh.sh
