# vm-proxy (DMZ): la única entrada web. El firewall (vm-fw) le reenvía el 80 y el 443 de su IP pública.
# Se instala en /etc/nginx/sites-available/vegaimplant.conf. Después, certbot le agrega HTTPS y la redirección:
#   sudo certbot --nginx -d vegaimplant.tech -d www.vegaimplant.tech --redirect
# Cambia vegaimplant.tech por el dominio que registren.

# Caché de los archivos compilados de la web (React): cambian de nombre en cada versión.
proxy_cache_path /var/cache/nginx/vega levels=1:2 keys_zone=vega_assets:10m max_size=500m inactive=7d use_temp_path=off;

upstream vega_app {
    server 10.20.4.4:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name vegaimplant.tech www.vegaimplant.tech;

    access_log /var/log/nginx/vega.access.log;
    error_log /var/log/nginx/vega.error.log;

    # Radiografías y fotos de hasta 25 MB (igual que PHP en vm-app).
    client_max_body_size 25m;

    # WAF: ModSecurity con OWASP CRS.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Encabezados de seguridad básicos sin ocultar los que ya pone Laravel (SecurityHeaders).
    server_tokens off;

    # Comprime el JavaScript, el CSS y los SVG (de la web y del panel). El gzip de nginx.conf solo comprime HTML:
    # sin esto, el JavaScript de la web viaja con sus 459 KB en vez de 139 KB y, en un celular con 4G lenta, la
    # página principal tarda unos 3,5 s en vez de 1,7-1,9 s en mostrarse (E3, evidencias/medicion-web.md).
    # El JSON de la API no se comprime: lleva datos del paciente y comprimirlo sobre HTTPS abre la puerta a BREACH.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # vm-app confía en este proxy (TRUSTED_PROXIES=10.20.3.4): así ve la IP real del paciente y sabe que es HTTPS.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 120s;

    # Panel interno (historia clínica, caja, copias): solo desde la sede, por la VPN.
    # El personal llega aquí porque el DNS de la sede resuelve el dominio a 10.20.3.4.
    location ^~ /panel {
        allow 10.10.0.0/16;
        deny all;
        proxy_pass http://vega_app;
    }

    # Livewire solo lo usa el panel: mismo acceso.
    location ^~ /livewire {
        allow 10.10.0.0/16;
        deny all;
        proxy_pass http://vega_app;
    }

    location ^~ /app/assets/ {
        proxy_cache vega_assets;
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://vega_app;
    }

    # Web pública, API /api/v1 y /up (lo revisa UptimeRobot).
    location / {
        proxy_pass http://vega_app;
    }
}
