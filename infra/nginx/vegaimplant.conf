# vm-app: sirve Laravel solo al proxy de la DMZ (el NSG de snet-app no deja entrar a nadie más por el 80).
# deploy-app.sh lo instala solo la primera vez.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/vega/current/public;
    index index.php;
    charset utf-8;

    # Radiografías y fotos de hasta 25 MB (igual que PHP).
    client_max_body_size 25m;

    access_log /var/log/nginx/vega.access.log;
    error_log /var/log/nginx/vega.error.log;

    # Los logs y las reglas de abajo usan la IP real que manda el proxy.
    set_real_ip_from 10.20.3.4;
    real_ip_header X-Forwarded-For;

    # Segunda barrera para el panel: aunque alguien llegara al proxy, sin ser de la sede no entra.
    location ^~ /panel {
        allow 10.10.0.0/16;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /livewire {
        allow 10.10.0.0/16;
        deny all;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
